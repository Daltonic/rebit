# ReBit — Docker Compose
# Orchestrates the full stack: frontend, backend, database, Inngest

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: rebit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rebit
      POSTGRES_PASSWORD: rebit
      POSTGRES_DB: rebit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rebit"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Inngest Job Queue ───────────────────────────────────────────────
  # Local Dev Server, not the self-hosted production server. No signing
  # or event keys needed — Inngest's own docs say to omit them here.
  # Trade-off: no persistence, in-memory only, resets on restart. Fine
  # for this stack's current scale; revisit with `inngest start` (see
  # git history) if that ever becomes a real problem.
  inngest:
    image: inngest/inngest:v1.27.0
    container_name: rebit-inngest
    restart: unless-stopped
    ports:
      - "8288:8288"
    command: >
      inngest dev --no-discovery
      --sdk-url http://frontend:3000/api/inngest
      --sdk-url http://backend:8000/api/inngest

  # ── Backend (Python FastAPI) ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rebit-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://rebit:rebit@postgres:5432/rebit"
      SIA_MODE: "${SIA_MODE:-auto}"
      SIA_KEY_PATH: "/app/data/sia/appkey.hex"
      SIA_INDEXER_URL: "${SIA_INDEXER_URL:-https://sia.storage}"
      CORS_ORIGINS: "http://localhost:3000"
      DEBUG: "${DEBUG:-false}"
      UPLOAD_DIR: "/tmp/rebit/uploads"
      OUTPUT_DIR: "/tmp/rebit/output"
      INNGEST_DEV: "1"
      INNGEST_BASE_URL: "http://inngest:8288"
    volumes:
      - task_uploads:/tmp/rebit/uploads
      - task_output:/tmp/rebit/output
      - sia_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend (Next.js) ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rebit-frontend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://rebit:rebit@postgres:5432/rebit"
      AUTH_SECRET: "${AUTH_SECRET:-rebit-dev-secret-change-in-production}"
      AUTH_URL: "http://localhost:3000"
      BACKEND_URL: "http://backend:8000"
      SIA_MODE: "${SIA_MODE:-auto}"
      SIA_KEY_PATH: "/app/data/sia/appkey.hex"
      SIA_INDEXER_URL: "${SIA_INDEXER_URL:-https://sia.storage}"
      INNGEST_DEV: "1"
      INNGEST_BASE_URL: "http://inngest:8288"
    volumes:
      - task_uploads:/tmp/rebit/uploads
      - sia_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  task_uploads:
    driver: local
  task_output:
    driver: local
  sia_data:
    driver: local